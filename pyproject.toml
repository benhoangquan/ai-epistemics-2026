[project]
name = "epi"
version = "0.1.0"
description = "Experiments for the Apart AI x Epistemics sprint (Nov 2026)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "datasets>=2.19",
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
