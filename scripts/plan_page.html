<title>Epistemics Report Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a compact instrument header; below it a pannable map on a faint dot grid, with a reading panel
   to its right (stacked under it on phones). Color: cool slate neutrals, one hue per track, gold for picks,
   magenta for RL. */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --fg: #1a1f2e;
  --muted: #586071;
  --line: #d6dae3;
  --dot: #cfd4de;
  --chip: #eceff4;
  --accent: #2f4fc2;
  --c-root: #3a4256;
  --c-pick: #a87300;
  --c-t1: #4462d4;
  --c-t2: #0e8673;
  --c-t3: #c0571c;
  --c-t4: #8a46b3;
  --c-theme: #6b7385;
  --c-rl: #b02f69;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10131a; --surface: #171b24; --fg: #e4e7ee; --muted: #9ba3b3; --line: #2a303d; --dot: #222835;
    --chip: #222836; --accent: #93a6ff; --c-root: #c9cfdb; --c-pick: #e2b33f; --c-t1: #7f97f5; --c-t2: #3fc4ae;
    --c-t3: #f08f4e; --c-t4: #c08ae8; --c-theme: #9ba3b3; --c-rl: #f27aaf; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10131a; --surface: #171b24; --fg: #e4e7ee; --muted: #9ba3b3; --line: #2a303d; --dot: #222835;
  --chip: #222836; --accent: #93a6ff; --c-root: #c9cfdb; --c-pick: #e2b33f; --c-t1: #7f97f5; --c-t2: #3fc4ae;
  --c-t3: #f08f4e; --c-t4: #c08ae8; --c-theme: #9ba3b3; --c-rl: #f27aaf; color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; display: flex; flex-direction: column;
  background: var(--bg); color: var(--fg); font: 400 14px/1.5 var(--font-body);
}

.top {
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 10px;
}
.headline { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 6px 20px; }
.headline > div { min-width: 0; }
.eyebrow { margin: 0; font: 500 11px/1.3 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 2px 0 0; font: 600 clamp(22px, 3vw, 28px)/1.1 var(--font-display); letter-spacing: -0.01em; text-wrap: balance; }
.lede { margin: 3px 0 0; color: var(--muted); }
.deadline {
  font: 500 12px/1.3 var(--font-mono); background: var(--chip); border: 1px solid var(--line);
  border-radius: 4px; padding: 5px 8px; white-space: nowrap;
}
.deadline b { color: var(--c-t3); font-weight: 500; }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.ctl-label { font: 500 11px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button, .fit {
  font: 500 13px/1 var(--font-body); color: var(--fg); background: transparent; border: 0; padding: 8px 11px; cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--surface); }
.fit { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.seg button:hover:not([aria-pressed="true"]), .fit:hover { background: var(--chip); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 16px; height: 3px; border-radius: 2px; flex: none; }

.work { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); }
.map {
  position: relative; min-width: 0; min-height: 0;
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 1px, transparent 1.2px);
  background-size: 22px 22px;
}
#mm { width: 100%; height: 100%; display: block; }
.hint {
  position: absolute; right: 12px; bottom: 10px; margin: 0;
  font: 500 11px/1.3 var(--font-mono); color: var(--muted); background: var(--surface);
  border: 1px solid var(--line); border-radius: 4px; padding: 4px 7px; pointer-events: none;
}

.panel {
  background: var(--surface); border-left: 1px solid var(--line); overflow-y: auto; min-height: 0;
  padding-block: 16px 28px;
  padding-left: 20px;
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.panel h2 { margin: 2px 0 8px; font: 600 21px/1.2 var(--font-display); text-wrap: balance; }
.panel h3 { margin: 18px 0 6px; font: 600 15px/1.3 var(--font-display); }
.panel p { margin: 0 0 10px; max-width: 62ch; }
.p-kicker { font: 500 11px/1.4 var(--font-mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin: 0 0 2px !important; }
.p-kicker.rl { color: var(--c-rl); }
.p-kicker.pick { color: var(--c-pick); }
.p-kicker.kill { color: var(--c-t3); }
.p-q { font-style: italic; color: var(--muted); }
.p-small { display: block; font-size: 12.5px; color: var(--muted); }
p.p-small { display: block; }
.p-list { margin: 0 0 10px; padding-left: 0; list-style: none; display: grid; gap: 8px; }
ol.p-list { list-style: decimal; padding-left: 22px; }
.p-links { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.p-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; background: var(--chip); border-radius: 4px; padding: 3px 7px; }
.p-box { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px 2px; margin: 14px 0; }
.p-box.rl { border-color: color-mix(in srgb, var(--c-rl) 45%, var(--line)); }
.p-box h3 { margin-top: 2px; }
.p-dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 10px; margin: 0 0 12px; font-size: 13px; }
.p-dl dt { text-align: center; }
.p-dl dd { margin: 0; color: var(--muted); }
.panel a { color: var(--accent); }
.ref {
  font: 500 13.5px/1.35 var(--font-body); color: var(--accent); background: none; border: 0; padding: 0;
  cursor: pointer; text-align: left; text-decoration: underline; text-decoration-thickness: 1px;
  text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent);
}
.ref:hover { text-decoration-color: var(--accent); }
.back { margin-bottom: 10px; font: 500 12px/1 var(--font-mono); text-decoration: none; }

/* Map nodes: markmap renders node HTML inside foreignObject, so page CSS reaches it. */
svg#mm {
  --markmap-text-color: var(--fg);
  --markmap-circle-open-bg: var(--surface);
  --markmap-font: 400 13.5px/1.4 var(--font-body);
  --markmap-highlight-node-bg: color-mix(in srgb, var(--accent) 16%, transparent);
}
.m-n { cursor: pointer; }
.m-n:hover { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
#mm b { font-weight: 600; }
.m-root { font: 600 18px/1.2 var(--font-display); }
.m-branch, .m-track { font: 600 15px/1.3 var(--font-display); }
.m-id { font: 500 11px/1 var(--font-mono); color: var(--muted); }
.m-eff {
  display: inline-block; font: 500 10.5px/1.2 var(--font-mono); color: var(--fg); border: 1px solid var(--line);
  border-radius: 3px; padding: 0 4px; vertical-align: 1px;
}
.m-rl { font: 500 10.5px/1 var(--font-mono); letter-spacing: 0.04em; color: var(--c-rl); }
.m-ex, .m-star { color: var(--c-pick); }

@media (max-width: 760px) {
  .work { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 42%); }
  .panel { border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .legend, .lede, .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<header class="top">
  <div class="headline">
    <div>
      <p class="eyebrow">Apart Research · AI x Epistemics sprint · report plan</p>
      <h1>Epistemics Report Plan</h1>
      <p class="lede">__STATS__</p>
    </div>
    <span class="deadline">Submissions close <b>Mon 16 Nov, 06:59 EST</b></span>
  </div>
  <div class="controls">
    <span class="ctl-label" id="show-label">Show</span>
    <div class="seg" role="group" aria-labelledby="show-label">
      <button type="button" id="lvl-2" data-level="2" aria-pressed="false">Branches</button>
      <button type="button" id="lvl-3" data-level="3" aria-pressed="true">Items</button>
      <button type="button" id="lvl-4" data-level="4" aria-pressed="false">Details</button>
      <button type="button" id="lvl-99" data-level="99" aria-pressed="false">All</button>
    </div>
    <button type="button" class="fit" id="fit">Fit to screen</button>
    <ul class="legend" aria-label="Branch colors">
      <li><span class="sw" style="background: var(--c-pick)"></span>Decision</li>
      <li><span class="sw" style="background: var(--c-t2)"></span>Paper A</li>
      <li><span class="sw" style="background: var(--c-t3)"></span>Paper B</li>
      <li><span class="sw" style="background: var(--c-t1)"></span>Rubric</li>
      <li><span class="sw" style="background: var(--c-theme)"></span>Shared</li>
      <li><span class="sw" style="background: var(--c-t4)"></span>Timeline</li>
      <li><span class="sw" style="background: var(--c-rl)"></span>Risks</li>
    </ul>
  </div>
</header>

<div class="work">
  <main class="map">
    <svg id="mm" role="img" aria-label="Mind map of the report plan"></svg>
    <p class="hint">Click a label to read it · click a dot to open or close</p>
  </main>
  <aside class="panel" id="panel" aria-live="polite" aria-label="Details"></aside>
</div>

<script type="application/json" id="mm-tree">__TREE__</script>
<script type="application/json" id="mm-details">__DETAILS__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-view@0.18.12/dist/browser/index.js"></script>
<script>
(function () {
  var tree = JSON.parse(document.getElementById("mm-tree").textContent);
  var details = JSON.parse(document.getElementById("mm-details").textContent);
  var svg = document.getElementById("mm");
  var panel = document.getElementById("panel");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var colorKeys = ["root", "pick", "t1", "t2", "t3", "t4", "theme", "rl"];
  var colors = {};
  var current = "root";

  function readColors() {
    var cs = getComputedStyle(document.documentElement);
    colorKeys.forEach(function (k) { colors[k] = cs.getPropertyValue("--c-" + k).trim(); });
  }
  readColors();

  var mm = window.markmap.Markmap.create(svg, {
    color: function (n) { return colors[(n.payload && n.payload.c) || "root"] || colors.root; },
    maxWidth: 360,
    initialExpandLevel: -1,
    duration: reduced ? 0 : 350,
    spacingVertical: 6,
    spacingHorizontal: 64,
    paddingX: 10
  });

  // Fold everything at or below `level`; the themes and RL-pattern branches stay shut until "Everything".
  function withFolds(n, level, depth) {
    var kids = n.children || [];
    var shut = kids.length && (depth >= level || (n.payload.aux && level < 99));
    return {
      content: n.content,
      payload: Object.assign({}, n.payload, { fold: shut ? 1 : 0 }),
      children: kids.map(function (c) { return withFolds(c, level, depth + 1); })
    };
  }

  // Path from the root to the node with key k, in markmap's live data.
  function pathTo(k) {
    var found = null;
    (function walk(n, trail) {
      if (found) return;
      var here = trail.concat([n]);
      if (n.payload && n.payload.k === k) { found = here; return; }
      (n.children || []).forEach(function (c) { walk(c, here); });
    })(mm.state.data, []);
    return found;
  }

  // Fit the whole map when it stays readable; otherwise anchor its top-left corner at a readable scale.
  function smartFit() {
    var box = svg.getBoundingClientRect();
    var r = mm.state.rect;
    var w = r.x2 - r.x1, h = r.y2 - r.y1;
    var minK = box.width < 600 ? 0.72 : 0.74;
    var k = Math.min(box.width / w, box.height / h) * 0.94;
    if (k >= minK) return mm.fit(1.15);
    var t = d3.zoomIdentity.translate(16 - r.x1 * minK, 16 - r.y1 * minK).scale(minK);
    return mm.transition(mm.svg).call(mm.zoom.transform, t).end().catch(function () {});
  }

  function highlightCurrent() {
    var p = pathTo(current);
    var visible = p && p.slice(0, -1).every(function (n) { return !n.payload.fold; });
    return mm.setHighlight(visible ? p[p.length - 1] : null);
  }

  var buttons = Array.prototype.slice.call(document.querySelectorAll("[data-level]"));
  function show(level) {
    buttons.forEach(function (b) { b.setAttribute("aria-pressed", String(Number(b.dataset.level) === level)); });
    return mm.setData(withFolds(tree, level, 1)).then(highlightCurrent).then(smartFit);
  }

  function render(k) {
    var html = details[k] || details.root;
    panel.innerHTML = (k === "root" ? "" : '<button type="button" class="ref back" data-go="root">← Overview</button>') + html;
    panel.scrollTop = 0;
  }

  // Select a node: show its text, highlight it, and when asked, open its ancestors and bring it into view.
  function select(k, reveal) {
    current = details[k] ? k : "root";
    render(current);
    var p = pathTo(current);
    if (!p) return;
    var target = p[p.length - 1];
    if (reveal) {
      p.slice(0, -1).forEach(function (n) { n.payload = Object.assign({}, n.payload, { fold: 0 }); });
      mm.renderData().then(function () { return mm.setHighlight(target); }).then(function () { return mm.centerNode(target); });
    } else {
      mm.setHighlight(target);
    }
  }

  svg.addEventListener("click", function (e) {
    var el = e.target.closest && e.target.closest("[data-k]");
    if (el) select(el.getAttribute("data-k"), false);
  });
  panel.addEventListener("click", function (e) {
    var el = e.target.closest("[data-go]");
    if (el) select(el.getAttribute("data-go"), true);
  });
  buttons.forEach(function (b) { b.addEventListener("click", function () { show(Number(b.dataset.level)); }); });
  document.getElementById("fit").addEventListener("click", function () { mm.fit(1.15); });

  function retheme() { readColors(); mm.renderData(); }
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", retheme);
  new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  var resizeTimer;
  window.addEventListener("resize", function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(smartFit, 150); });

  render("root");
  var fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.race([fontsReady, new Promise(function (r) { setTimeout(r, 1500); })]).then(function () { show(3); });
})();
</script>
