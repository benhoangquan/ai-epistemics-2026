# Single source of truth for the brainstorm. Edit this file, then run: python3 scripts/build.py
# Idea ids are generated from position (P1.2 + a/b/c/d -> P1.2b), so reordering ideas changes ids.

meta:
  sprint: AI x Epistemics Research Sprint
  url: https://apartresearch.com/sprints/ai-x-epistemics-research-sprint-2026-11-13-to-2026-11-15
  dates: 13–15 Nov 2026
  deadline: Sun 15 Nov 2026, 23:59 AoE

effort:
  S: about one day for one or two people
  M: a full weekend for a small team
  L: stretch goal; needs humans, a pilot study or heavy compute

rl_patterns:
  adversary:
    name: RL adversary
    what: >-
      A policy rewarded for exposing a failure. Cheap form: a bandit or best-of-n over an LLM's attacks.
      Full form: GRPO on a small model.
  reward:
    name: Metric as reward
    what: >-
      Turn the proposed metric into a reward and optimize against it (best-of-n, or GRPO/DPO on a 0.5B to 1.5B
      model with TRL). Any reward hacking that shows up is itself a result.
  bandit:
    name: Bandit for active evaluation
    what: >-
      Thompson sampling decides which item, scenario or model to evaluate next, so the same answer costs fewer calls.
  selfplay:
    name: Self-play and multi-agent RL
    what: >-
      Two or more learning agents (disputants, debaters, competing sources) optimize against each other, and we
      study the equilibrium they reach.
  irl:
    name: Inverse RL
    what: >-
      Infer the reward people actually hold from what they endorse later, instead of assuming one.
  delayed:
    name: Delayed reward
    what: >-
      Credit assignment when the outcome resolves long after the decision, as with forecasts and recommendations.
  ope:
    name: Off-policy evaluation
    what: >-
      Estimate how a different policy would have done, using logs collected under the current one.

themes:
  - name: Late or missing ground truth
    what: Outcomes arrive weeks or years after the decision, or never.
    problems: [P1.1, P3.1, P4.1, P4.3]
  - name: Goodhart and gaming
    what: Any score that matters gets optimized against, by models, sources or institutions.
    problems: [P1.4, P2.1, P2.2, P3.3]
  - name: Warranted updating vs. caving
    what: Changing your mind for good evidence is a virtue; changing it for social pressure is sycophancy.
    problems: [P1.2, P3.1, P3.2, P3.4]
  - name: Hindsight endorsement as the target
    what: The goal is decisions people stand behind later, not advice that feels good now.
    problems: [P3.1, P3.3, P4.1]
  - name: Auditability
    what: A check only builds trust if outsiders can recompute it from public records.
    problems: [P2.1, P2.2, P2.4, P4.4]
  - name: Are the signals used at all?
    what: Good signals are useless if agents, people and institutions ignore them.
    problems: [P2.3, P4.2, P4.3]

tracks:
  - id: T1
    name: Model epistemics & decision evals
    question: Does a model know how solid its claims are, and can its confidence be elicited and checked?
    problems:
      - id: P1.1
        title: Decision confidence vs. outcomes
        problem: >-
          A model's confidence in its recommendations may not match how often they work out, and the outcomes
          that would show this arrive weeks or years later.
        ideas:
          - title: Resolved-decision backtest
            sprint_example: true
            effort: S
            what: >-
              Reframe questions that resolved after the model's training cutoff as decisions ("should X do Y?").
              Elicit a recommendation plus P(it works out), then score Brier and calibration error on the
              recommendations, not only on forecasts.
            data: ForecastBench, resolved Metaculus questions, Inspect
            rl:
              pattern: delayed
              title: Brier-reward fine-tune
              what: >-
                GRPO a 0.5B to 1.5B model with reward = negative Brier score on questions resolved before date D.
                Test on questions resolved after D, then on decision framings it never trained on. Does
                calibration transfer from forecasts to recommendations?
          - title: Three ways to ask "how sure?"
            effort: S
            what: >-
              For the same decision, elicit confidence three ways: a verbal probability, a choice between the claim
              and a lottery with known odds, and agreement across 10 samples. Measure how often they disagree and
              which one tracks outcomes best.
            data: any resolved QA or forecasting set
            rl:
              pattern: reward
              title: Coherence reward
              what: >-
                Reward agreement between the three measures. Check whether the trained model becomes better
                calibrated or only consistent and still wrong. Either outcome is a finding.
          - title: Hindsight oracle
            effort: M
            what: >-
              Where real outcomes are missing, give a strong model the documents that reveal what happened and let
              it grade the earlier recommendation. Validate the oracle on cases with known outcomes before trusting it.
            data: news archives, ForecastBench resolutions
            rl:
              pattern: bandit
              title: Budgeted resolution
              what: >-
                Thompson sampling over domains chooses which decisions get an expensive resolution (oracle or human).
                Show the calibration error can be estimated with far fewer resolutions than uniform sampling needs.
          - title: Stakes-shift test
            effort: S
            what: >-
              Hold the evidence fixed and change only the stakes (a hobby, a mortgage, a medication). Measure
              whether stated confidence moves when it should not.
            data: templated scenarios
            rl:
              pattern: adversary
              title: Framing adversary
              what: >-
                A bandit over framing features (stakes, authority, urgency, user emotion) is rewarded by the
                confidence shift it causes while the evidence stays fixed. The output is a ranked catalog of
                framings that move confidence.

      - id: P1.2
        title: Implied vs. defended claims
        problem: >-
          What a model implies differs from what it will defend under questioning: it oversells, flip-flops and
          misstates its evidence.
        ideas:
          - title: Commitment ledger
            sprint_example: true
            effort: M
            what: >-
              Extract each atomic claim in a model's first answer with the confidence it implies. Later in the
              conversation, probe each claim with a neutral "how sure are you of this?". The gap score is implied
              minus defended confidence, per claim.
            data: MASK-style items, Inspect
            rl:
              pattern: adversary
              title: RL interrogator
              what: >-
                A bandit over probe templates (neutral, skeptical, authority, "my friend says") is rewarded by the gap
                it exposes. Compare with random probing to see which claims a model drops fastest.
          - title: Warranted vs. capitulating flips
            sprint_example: true
            effort: S
            what: >-
              A 2x2 design: the first answer is right or wrong, and the rebuttal carries valid or bogus evidence.
              Measure FlipRate in each cell. Good behavior flips only when wrong and given valid evidence.
            data: SycEval, MMLU-Pro or GPQA items with written rebuttals
            rl:
              pattern: reward
              title: Anti-capitulation GRPO
              what: >-
                GRPO on a small model rewards being correct after the rebuttal, with an extra penalty for flipping on
                bogus evidence. Does it stop caving without turning stubborn toward valid evidence?
          - title: Evidence fidelity audit
            effort: S
            what: >-
              Give the model a source and ask for an answer that cites it. Check every paraphrase against the source
              with NLI and an LLM judge, and record whether misstatements inflate or deflate certainty.
            data: AVeriTeC, supplied documents
            rl:
              pattern: reward
              title: Fidelity reranker
              what: >-
                Train a fidelity reward model and use it for best-of-n reranking. Report the fidelity gain and the
                helpfulness cost, and watch for the obvious hack of quoting verbatim and saying nothing.
          - title: Hedge-washing detector
            effort: M
            what: >-
              Answers can sound certain while burying a hedge that lets the model later say "I said it might".
              Compare the confidence readers perceive (LLM-simulated readers plus a small human check) with the
              literal hedges in the text.
            data: generated advice answers
            rl:
              pattern: reward
              title: Plain-reading rewriter
              what: >-
                Train a rewriter whose reward is agreement between perceived and literal confidence, so answers are
                honest in what they imply, not only in what they literally say.

      - id: P1.3
        title: Honesty scores vs. decision quality
        problem: >-
          We don't know whether models that rank higher on honesty benchmarks actually help people make better
          decisions.
        ideas:
          - title: Cross-model rank correlation
            effort: M
            what: >-
              Take 8 to 15 models with public MASK, DarkBench and SycEval scores. Run a small decision battery
              (resolved forecasts, rubric-graded briefs, dispute replies) and compute Spearman correlations with
              bootstrap confidence intervals.
            data: published benchmark scores, OpenRouter
            rl:
              pattern: bandit
              title: Budgeted eval grid
              what: >-
                Each (model, task) cell is an arm. A bandit picks which cells to run next under a fixed API budget so
                the rank-correlation estimate tightens fastest.
          - title: Capability-controlled factor analysis
            effort: M
            what: >-
              Fit an item response model across models and tasks, separate an honesty factor from general
              capability, and test whether honesty still predicts decision quality once capability is controlled.
              This is the safetywashing check (Ren et al., 2024).
            data: per-item benchmark results
            rl:
              pattern: adversary
              title: Validity counterexamples
              what: >-
                An adversary searches for decision tasks where honesty score and decision quality disagree most,
                rewarded by rank inversions. The result is a counterexample set for the benchmark's validity.
          - title: Within-model honesty intervention
            effort: M
            what: >-
              Raise honesty inside one model (a system prompt, a steering vector, or a small fine-tune of an open
              model) and measure the change in decision quality. This gives a causal answer where cross-model
              comparison only gives a correlation.
            data: open-weight model, MASK
            rl:
              pattern: reward
              title: Honesty-reward transfer
              what: >-
                DPO or GRPO a small model on a MASK-style honesty reward. Check whether the gains reach decision tasks
                or stay inside the benchmark's own format.
          - title: Advice uplift with simulated users
            effort: L
            what: >-
              LLM personas make decisions with advice from high- and low-honesty models. Measure accuracy and
              over-reliance, and add a small human pilot if time allows.
            data: decision scenarios with known best choices
            rl:
              pattern: reward
              title: Satisfaction vs. accuracy advisors
              what: >-
                Train one advisor on user satisfaction and one on the user's final accuracy, then score both on
                honesty benchmarks. Does the accuracy-trained advisor also rank as more honest?

      - id: P1.4
        title: Benchmark decay and gaming
        problem: >-
          Epistemic benchmarks leak into training data, saturate, and can be gamed with cheap tricks, so their
          rankings stop meaning anything.
        ideas:
          - title: Question-rotation protocol
            sprint_example: true
            effort: S
            what: >-
              Generate items from templates so every release gets new surface forms. Measure test-retest stability
              across rotations, and use the gap between public and rotated items as a contamination signal.
            data: MASK and DarkBench items as seeds
            rl:
              pattern: adversary
              title: Self-refreshing item generator
              what: >-
                An item generator is rewarded for IRT discrimination and penalized for similarity to public items,
                which keeps the benchmark hard and fresh.
          - title: Cheat-policy stress test
            effort: S
            what: >-
              Write 5 to 10 trivial cheat policies (always hedge, always refuse, be verbose, echo the judge's
              phrasing, answer 60% to everything) and score them on public epistemic benchmarks. Report which
              benchmarks a trivial policy can top.
            data: Inspect evals for MASK, SycEval, calibration sets
            rl:
              pattern: reward
              title: Automated Goodhart audit
              what: >-
                GRPO a 0.5B to 1.5B model directly against a benchmark's own grader and catalogue the exploits it
                discovers. Each exploit becomes a patch or a warning label for that benchmark.
          - title: Contamination probes
            effort: M
            what: >-
              Measure per-item memorization on public honesty benchmarks (stem completion, perplexity gaps against
              paraphrases) to estimate how contaminated each benchmark already is.
            data: open-weight models, benchmark items
            rl:
              pattern: bandit
              title: Probe allocation
              what: >-
                A bandit over probe types and items finds the contaminated items with far fewer queries than probing
                everything.
          - title: Judge robustness
            effort: S
            what: >-
              Many epistemic benchmarks grade with an LLM judge. Build counterfactual answer pairs that differ only
              in tone, length or confident phrasing, and measure how far the judge's score moves.
            data: judge prompts from public benchmarks
            rl:
              pattern: adversary
              title: Judge exploitation gap
              what: >-
                Optimize answers to raise the judge's score while a stronger held-out judge's score falls. The size
                of that gap measures how exploitable the judge is.

  - id: T2
    name: Trust infrastructure
    question: >-
      How do we make checking claims and tracing their origins cheap, routine and hard to manipulate, for people
      and for AI agents?
    problems:
      - id: P2.1
        title: Gameable reliability scores
        problem: >-
          Source-reliability scores can be gamed (cherry-picking easy claims, vague hedging, flooding with trivial
          truths) and are hard for outsiders to audit.
        ideas:
          - title: Track-Record Ledger with proper scoring
            sprint_example: true
            effort: M
            what: >-
              Log dated, resolvable claims per source and resolve them. Score each source with a proper scoring
              rule, per-topic shrinkage and difficulty weighting, and publish the log so anyone can recompute the
              score.
            data: resolved news claims, Metaculus, fact-check archives
            rl:
              pattern: adversary
              title: Learning cheaters
              what: >-
                Train adversarial sources that learn which claims to make to maximize their score without being
                informative. Rank scoring rules by how far a learning cheater can inflate its score.
          - title: Beat-the-crowd scoring
            effort: M
            what: >-
              Give a source credit only when it departed from consensus and turned out right, measured as
              information gain over the crowd's prior. Backtest against plain accuracy on resolved claims.
            data: Metaculus community forecasts, resolved claims
            rl:
              pattern: selfplay
              title: Competing sources
              what: >-
                Several RL sources compete under this score. Check whether the equilibrium rewards honest reporting
                or pushes sources toward contrarian noise.
          - title: Resolvability filter
            effort: S
            what: >-
              Score each claim for how resolvable it is (specific, dated, measurable). A source whose claims are
              mostly unresolvable gets flagged instead of being rewarded for never being wrong.
            data: news and pundit claims
            rl:
              pattern: adversary
              title: Vagueness adversary
              what: >-
                An adversary rewrites claims to stay persuasive while becoming less resolvable. Retrain the
                resolvability classifier against it and repeat.
          - title: Bridging-score attack cost
            effort: M
            what: >-
              Run the open-source Community Notes scorer on its public data and measure how many coordinated fake
              raters it takes to flip a note's status.
            data: Community Notes open data and scoring code
            rl:
              pattern: adversary
              title: RL Sybil raters
              what: >-
                Sybil raters learn which notes to rate and how, minimizing the number of accounts needed to flip a
                note. The result is an attack-cost curve for the bridging algorithm.

      - id: P2.2
        title: No tamper-evident layer
        problem: >-
          AI observability standards (the OpenTelemetry GenAI conventions) record what agents did, but nothing makes
          those records tamper-evident.
        ideas:
          - title: Tamper-Evident Action Recorder
            sprint_example: true
            effort: M
            what: >-
              An OTel span exporter that hash-chains spans, publishes signed Merkle checkpoints to a transparency log
              in the style of RFC 6962, and comes with an auditor view that checks inclusion and consistency proofs.
            data: OTel GenAI conventions, Sigstore Rekor or a local log
            rl:
              pattern: adversary
              title: RL log tamperer
              what: >-
                A tampering agent tries to edit its own trace without detection (dropping spans, reordering, forging
                tool outputs). Report which logging guarantee catches which attack.
          - title: Spec gap analysis
            effort: S
            what: >-
              List the agent actions the GenAI conventions leave optional or missing (system prompt hash, retrieved
              documents, model version, tool arguments). Propose a minimal set of integrity attributes and test it
              on two agent frameworks.
            data: OTel GenAI semantic conventions
            rl:
              pattern: adversary
              title: Compliant side tasks
              what: >-
                An agent is rewarded for completing a hidden side task while its logs stay spec-compliant. Every
                success points to something the spec fails to record.
          - title: Cosigned tool calls
            effort: M
            what: >-
              Tool servers (for example MCP servers) sign each response so an agent cannot fabricate tool output in
              its log. Measure the overhead and how many fabricated tool calls it catches.
            data: MCP servers, agent transcripts
            rl:
              pattern: adversary
              title: Fabrication red team
              what: >-
                A red-team agent is rewarded for fabricating plausible tool outputs. Compare detection rates with
                and without cosigning.
          - title: Omission detection
            effort: M
            what: >-
              Hash chains catch edits but not omissions. Cross-check agent logs against counterparty records (tool
              server logs, API token usage and billing) to detect missing spans.
            data: agent traces plus provider usage logs
            rl:
              pattern: adversary
              title: Strategic omission
              what: >-
                An adversary picks which spans to drop to finish a hidden action with the lowest chance of detection.
                The result maps which omissions can be detected at all.

      - id: P2.3
        title: Do trust signals help?
        problem: >-
          We don't know whether reliability and provenance signals (source scores, C2PA, Community Notes) make AI
          agents or people more accurate.
        ideas:
          - title: Provenance study
            sprint_example: true
            effort: M
            what: >-
              RAG agents answer questions over a corpus with planted misinformation, with and without machine-readable
              signals (source track records, C2PA manifests, attached notes). Measure accuracy and how often the
              misinformation is repeated.
            data: AVeriTeC, c2patool, Community Notes
            rl:
              pattern: reward
              title: Signal-use training
              what: >-
                Train the agent on accuracy (GRPO, or a bandit over prompting strategies), then spoof the signals to
                test whether it learned to over-trust them.
          - title: Forged-signal robustness
            effort: S
            what: >-
              Forge 10 to 30% of the signals and measure the accuracy drop, comparing signed (verifiable) signals
              with unsigned ones.
            data: same corpus as the provenance study
            rl:
              pattern: adversary
              title: Budgeted forger
              what: >-
                An attacker with a forging budget learns which signals to forge for maximum damage, giving a worst
                case instead of a random-forgery average.
          - title: Trust calibration
            effort: S
            what: >-
              Check whether signals make the agent's confidence better calibrated, not only its accuracy higher, by
              comparing calibration error with and without signals.
            data: same corpus as the provenance study
            rl:
              pattern: reward
              title: Learned source weights
              what: >-
                Reward with Brier score while signals are visible, then compare the weight the agent learns for each
                source with that source's true reliability.
          - title: Signal format test
            effort: S
            what: >-
              Show the same signal as a badge, a number, a sentence or a note, and measure which format moves agent
              (and, if possible, human) answers by the right amount.
            data: same corpus as the provenance study
            rl:
              pattern: bandit
              title: Format bandit
              what: >-
                A contextual bandit learns which format to show for each kind of question to maximize accuracy.

      - id: P2.4
        title: How much is checkable?
        problem: >-
          Nobody knows what share of a domain's content (council minutes, health advice, financial news) can be
          tied to checkable evidence.
        ideas:
          - title: Claim-binding audit
            effort: M
            what: >-
              Sample documents from three domains and extract atomic claims. Label each one as checkable with public
              evidence, checkable only with private data, opinion, or unresolvable. Try automatic binding (retrieve
              and verify) and report the bindable share per domain with confidence intervals.
            data: council minutes, health advice pages, financial news
            rl:
              pattern: bandit
              title: Verification budget
              what: >-
                A bandit spreads the verification budget across claim types and domains to maximize verified claims
                per dollar.
          - title: Citation Binder
            sprint_example: true
            effort: M
            what: >-
              For each citation, decide whether it supports its specific claim and quote the supporting passage.
              Evaluate on AVeriTeC plus a fresh set of chatbot answers, and report citation precision per chatbot.
            data: AVeriTeC, chatbot answers with citations
            rl:
              pattern: reward
              title: Support-reward citer
              what: >-
                Use the support verdict as a reward to train a model that adds citations. Watch for shortcuts such
                as citing generic pages or quoting near-identical text.
          - title: Evidence decay
            effort: S
            what: >-
              Measure how fast the bindable share falls as links rot or go behind paywalls: what fraction of
              citations in 2015, 2020 and 2025 documents still resolve, live or in the Wayback Machine.
            data: Wayback Machine availability API, Wikipedia citations
            rl:
              pattern: bandit
              title: Evidence recovery agent
              what: >-
                A recovery agent (a bandit over archives and query rewrites) is rewarded when it finds evidence that
                verifies the claim. Measure how much of the decay it can reverse.
          - title: Write-time binding
            effort: M
            what: >-
              A tool that rewrites a document so that every claim either carries a source or is marked as opinion.
              Measure how much of the original content survives.
            data: op-eds, press releases
            rl:
              pattern: reward
              title: Binding rewriter
              what: >-
                GRPO the rewriter with reward = bound share x meaning preservation, and watch for the obvious hack of
                deleting hard claims.

  - id: T3
    name: Epistemic products
    question: Do tools improve the decisions people endorse later, not just how satisfying the advice feels?
    problems:
      - id: P3.1
        title: Satisfying vs. endorsed advice
        problem: >-
          Advice that feels good in the moment (sycophancy) can lead to choices people later regret, and can deepen
          dependence on the assistant.
        ideas:
          - title: Hindsight endorsement eval
            effort: M
            what: >-
              Simulated users get advice. Then a "later self" sees the outcome and the full context and rates the
              advice again. Compare immediate satisfaction with hindsight endorsement for sycophantic and candid
              advice, with a small human pilot.
            data: decision scenarios with scripted outcomes
            rl:
              pattern: irl
              title: Two reward models
              what: >-
                Learn one reward model from immediate ratings and one from hindsight ratings. DPO a small model on each
                and compare the advice they give side by side.
          - title: Reddit update threads
            effort: M
            what: >-
              Advice posts with a later "UPDATE" show what the poster did and how it went. Check whether model advice
              matches what posters later endorsed, and compare it with the top-voted comment.
            data: Reddit advice subreddits, ELEPHANT
            rl:
              pattern: delayed
              title: Hindsight-labelled reranker
              what: >-
                Use the updates as delayed reward labels. Train one reranker on hindsight outcomes and one on upvotes,
                and study where they disagree.
          - title: Dependence over sessions
            effort: L
            what: >-
              Simulate users over several sessions and measure whether their unaided reasoning gets worse with a
              sycophantic assistant than with a candid one, following Cheng et al. (2025).
            data: simulated users, reasoning tasks
            rl:
              pattern: reward
              title: Engagement vs. teaching
              what: >-
                Train one assistant on engagement and one on the user's later unaided accuracy, and compare the
                policies that emerge.
          - title: Reflection prompts
            effort: S
            what: >-
              Before acting, users go through a short structured reflection (values, consequences, what would change
              their mind). Measure how often the choice changes and whether the new choice holds up.
            data: simulated users, decision scenarios
            rl:
              pattern: bandit
              title: Reflection bandit
              what: >-
                A bandit picks which reflection prompt to show, rewarded by choices that hold up in hindsight.

      - id: P3.2
        title: Chatbots and disputes
        problem: >-
          A chatbot helping one side of a conflict may escalate it, for example by validating grievances and
          drafting harsher messages.
        ideas:
          - title: Dispute Escalation Benchmark
            sprint_example: true
            effort: M
            what: >-
              Realistic conflicts (landlord, employer, ex-partner, neighbor). Score replies and drafted messages on a
              mediator rubric: demands, concessions, hostility, and how much of the user's framing is adopted. Rerun
              on every model release.
            data: hand-written scenarios, mediator rubric
            rl:
              pattern: selfplay
              title: Counterparty self-play
              what: >-
                An LLM counterparty answers each drafted message. Reward reaching a resolution both sides accept, and
                compare RL-tuned drafts with the base model's.
          - title: Mirror test
            effort: S
            what: >-
              Tell the same dispute from each side. Measure whether the model sides with whoever is talking, and by
              how much.
            data: paired scenarios, AITA-style posts rewritten from the other side
            rl:
              pattern: reward
              title: Symmetry reward
              what: >-
                Reward the model for giving the same assessment under both tellings, and check that it does not get
                there by going vague.
          - title: Two assistants, one conflict
            effort: M
            what: >-
              Both parties use their own AI assistant. Simulate the exchange over many turns and track how escalation
              evolves, following Stray's work on conflict feedback loops.
            data: simulated disputants
            rl:
              pattern: selfplay
              title: Assistant arms race
              what: >-
                Each assistant optimizes for its own user. Test whether this produces prisoner's-dilemma escalation,
                and whether a shared de-escalation reward fixes it.
          - title: Escalation classifier
            effort: S
            what: >-
              Prompt or train an escalation classifier on the Conversations Gone Awry corpus, check it against
              mediator labels, and use it as a cheap metric for the benchmark.
            data: ConvoKit Conversations Gone Awry corpus
            rl:
              pattern: adversary
              title: Passive-aggression adversary
              what: >-
                An adversary writes messages the classifier rates calm but a strong judge rates escalating, such as
                passive aggression. Use them to harden the classifier.

      - id: P3.3
        title: Briefings that miss what matters
        problem: >-
          AI decision briefings may read well yet leave out the considerations that should drive the decision.
        ideas:
          - title: Decision-Brief Rubric
            sprint_example: true
            effort: M
            what: >-
              Expert-derived checklists of key considerations per domain (personal finance, careers, choosing a
              health charity) plus a harness that scores each brief's recall of them.
            data: expert checklists, chatbot briefs
            rl:
              pattern: reward
              title: Rubric-reward briefs
              what: >-
                Use rubric recall as a reward with best-of-n or GRPO. Penalize length, and check whether briefs turn
                into bloated checklists.
          - title: Consideration bank
            effort: M
            what: >-
              Generate many briefs across models, cluster the considerations they raise, and have a judge or expert
              mark which ones matter. Score each model's recall against the bank.
            data: briefs from several models
            rl:
              pattern: bandit
              title: Novelty bandit
              what: >-
                A bandit chooses which model and prompt to sample next so the bank gains the most new considerations
                per call.
          - title: Buried decisive fact
            effort: S
            what: >-
              Hide one decisive fact in the context, such as a hidden fee or a drug interaction, and test whether the
              brief surfaces it and gives it the right weight.
            data: templated decision contexts
            rl:
              pattern: adversary
              title: Burial adversary
              what: >-
                An adversary chooses where and how to bury the fact to maximize how often it is missed.
          - title: Downstream decision test
            effort: M
            what: >-
              In scenarios with a known best choice, simulated decision-makers choose with and without the brief.
              Measure whether the brief moves them toward the best choice for the right reasons.
            data: constructed scenarios with known optimal choices
            rl:
              pattern: reward
              title: Outcome-rewarded briefer
              what: >-
                Reward the brief writer by the decision-maker's correctness instead of a quality rubric, and compare
                the briefs it learns to write.

      - id: P3.4
        title: Do cruxes change decisions?
        problem: >-
          We don't know whether showing a group its cruxes, shared ground and inconsistencies changes what it
          decides.
        ideas:
          - title: Crux Mapper
            sprint_example: true
            effort: M
            what: >-
              An AI interviews each participant on their own time, extracts their claims and probabilities, and maps
              shared ground, cruxes and inconsistencies. Pilot it with the team or volunteers, or on public debate data.
            data: interviews, Kialo or Polis data
            rl:
              pattern: bandit
              title: Information-gain interviewer
              what: >-
                The interviewer picks follow-up questions with a bandit, rewarded by information gain about the
                participant's crux.
          - title: Simulated deliberation
            effort: S
            what: >-
              Groups of LLM agents with seeded beliefs discuss questions that have known answers. One condition sees
              a crux map and the other does not. Measure convergence and accuracy.
            data: questions with known answers, LLM agents
            rl:
              pattern: reward
              title: Accuracy-rewarded presenter
              what: >-
                Train the crux presenter on group accuracy, not consensus, and watch for the manipulation risk of
                simply pushing the majority view.
          - title: Personal inconsistency check
            effort: S
            what: >-
              Ask for probabilities on logically linked forecasting questions, flag coherence violations, and
              measure whether people revise and whether revising improves accuracy.
            data: linked forecasting questions
            rl:
              pattern: bandit
              title: Which inconsistency first
              what: >-
                A bandit decides which inconsistency to show first to get the largest accuracy gain per prompt.
          - title: Polis replay
            effort: M
            what: >-
              Using public Polis and vTaiwan data, test whether LLM-generated crux statements predict how the opinion
              groups formed. Compare with the Habermas Machine (Tessler et al., 2024).
            data: compdemocracy openData
            rl:
              pattern: reward
              title: Bridging-statement generator
              what: >-
                Train a statement generator with predicted cross-group agreement as reward, and check whether it
                drifts toward vague statements everyone accepts.

  - id: T4
    name: Open track
    question: >-
      What else advances AI for epistemics, including meta-questions about deployment, adoption and impact?
    problems:
      - id: P4.1
        title: No unit of decision quality
        problem: The field has no defensible unit for "decision quality improved", its equivalent of the QALY.
        ideas:
          - title: Value-of-information unit
            sprint_example: true
            effort: M
            what: >-
              Define decision quality as the expected-value gain of deciding with the intervention versus without
              it, normalized by stakes. Test it retroactively on documented decisions, such as the intelligence
              forecasts in Mandel & Barnes (2014).
            data: documented decisions, intelligence forecast records
            rl:
              pattern: delayed
              title: Regret check
              what: >-
                In toy MDPs, decision quality is regret against the optimal policy given the available information.
                Check whether the proposed unit tracks that regret.
          - title: Process score
            effort: M
            what: >-
              A rubric for decision process (alternatives considered, base rates used, calibrated probabilities, a
              premortem). Validate it against outcomes on a set of documented decisions.
            data: post-mortems, policy decision records
            rl:
              pattern: irl
              title: Inferred rubric weights
              what: >-
                Infer the rubric weights from expert ratings of decisions with inverse RL instead of setting them by
                hand.
          - title: Metric stress test
            effort: S
            what: >-
              Compare five candidate units (Brier gain, regret reduction, hindsight endorsement, process score, value
              of information) on comparability across domains, gameability and cost to measure, scored on 20
              historical decisions.
            data: 20 documented historical decisions
            rl:
              pattern: adversary
              title: Goodhart-robustness test
              what: >-
                An RL agent optimizes each metric in a simulator. A metric whose optimum also maximizes true utility
                holds up under optimization pressure.
          - title: Separating skill from luck
            effort: M
            what: >-
              Replay the same decision many times in an LLM-simulated world with varied events, to estimate how much
              of an outcome came from the decision and how much from luck.
            data: LLM world simulator
            rl:
              pattern: ope
              title: Rollout policy evaluation
              what: >-
                Monte Carlo policy evaluation over the rollouts estimates each decision's expected value apart from
                the outcome that actually happened.

      - id: P4.2
        title: Legislatures can't adopt AI tools
        problem: Certification, budget and procurement rules keep official AI tools out of legislatures.
        ideas:
          - title: Procurement Gap Report
            sprint_example: true
            effort: M
            what: >-
              Trace, document by document, the rules (security certification, data residency, procurement thresholds,
              records law) that block legislative staff from AI tools in 5 to 10 legislatures. Build a table of rule,
              blocker type and owner.
            data: public procurement and IT policy documents
            rl:
              pattern: bandit
              title: Rule-finding search agent
              what: >-
                A search agent learns, as a bandit over query strategies and document sources, which searches surface
                relevant rules fastest.
          - title: Approval-path model
            effort: S
            what: >-
              Encode the approval process as a graph with time and cost per step. Estimate time to deployment and
              find the single rule change that saves the most time.
            data: the procurement gap table
            rl:
              pattern: delayed
              title: Reformer MDP
              what: >-
                Treat the approval path as an MDP solved by value iteration, and let an RL reformer with a limited
                budget choose which bottlenecks to remove.
          - title: Adopters vs. non-adopters
            effort: S
            what: >-
              Compare legislatures that adopted AI tools with those that didn't, coding features such as IT
              governance, budget cycle and party control.
            data: public announcements, parliamentary IT policies
            rl:
              pattern: bandit
              title: Pilot-placement bandit
              what: >-
                Frame where to run pilots as a contextual bandit, showing which features predict a successful pilot.
          - title: Paperwork gap
            effort: M
            what: >-
              Map each security requirement to the public documentation of existing enterprise AI tools. Separate
              requirements that are unmet from requirements that are met but undocumented.
            data: security questionnaires, vendor trust pages
            rl:
              pattern: reward
              title: Questionnaire agent
              what: >-
                An agent fills compliance questionnaires from public docs, rewarded for answers that check out. Its
                failures show where documentation is missing.

      - id: P4.3
        title: Ignored forecasts
        problem: Institutions often ignore forecasts they commissioned.
        ideas:
          - title: Uptake audit
            effort: S
            what: >-
              Collect public cases of commissioned forecasts (Swift Centre, Sentinel, FutureSearch, IARPA ACE,
              government foresight units). Code whether each one was used and, if not, why: timing, framing, no
              decision attached, or lack of trust.
            data: public forecasting write-ups
            rl:
              pattern: bandit
              title: Trust as a learner
              what: >-
                Model the decision-maker as a bandit learner who updates trust in the forecaster from its track
                record. Simulate how fast trust and uptake grow under different reporting schedules.
          - title: Decision-hook formats
            effort: S
            what: >-
              Rewrite one forecast in several formats (probability only, "if X then do Y" triggers, scenario
              narrative, expected value per action) and test which format changes decisions for simulated or real
              decision-makers.
            data: published forecasts
            rl:
              pattern: bandit
              title: Format-per-audience bandit
              what: >-
                A contextual bandit learns which format to use for which kind of audience.
          - title: Conditional forecasts
            effort: M
            what: >-
              Forecast the outcome under each available action, P(outcome | A) and P(outcome | B), and test whether
              LLM forecasters keep these conditionals coherent.
            data: policy questions with linked conditionals
            rl:
              pattern: reward
              title: Regret-rewarded forecaster
              what: >-
                Reward forecasts by the regret of the action they lead to instead of by Brier score, and compare with
                a Brier-trained forecaster.
          - title: Citation trail
            effort: M
            what: >-
              Search parliamentary records for mentions of commissioned forecasts and measure how often they come up
              in later debates and decisions.
            data: UK Hansard API
            rl:
              pattern: bandit
              title: Query bandit
              what: >-
                A bandit over search queries finds forecast mentions with fewer API calls.

      - id: P4.4
        title: Measuring live deployments
        problem: It is hard to measure a live deployment's effect using only data you can download in a weekend.
        ideas:
          - title: AI-written Community Notes
            effort: M
            what: >-
              If the public Community Notes data marks AI-written notes, compare their helpfulness ratings, speed and
              coverage with human notes. Check that marker first, and drop the idea if it isn't there.
            data: Community Notes open data
            rl:
              pattern: reward
              title: Reward-hacking signatures
              what: >-
                AI note writers are optimized against the bridging scorer. Look for signs of reward hacking in their
                notes, such as converging style or hedged wording that rates well.
          - title: Do their numbers match?
            sprint_example: true
            effort: M
            what: >-
              Check quantitative claims in parliamentary transcripts and press releases against the statistics they
              cite, and report the mismatch rate.
            data: UK Hansard API, ONS releases
            rl:
              pattern: reward
              title: Verification policy
              what: >-
                Train a verification agent to choose which numbers to check and where to look, rewarded by agreement
                with a hand-checked subset.
          - title: Interrupted time series
            effort: S
            what: >-
              Use public timelines (model releases, feature rollouts) and public metrics (Community Notes volume,
              Stack Overflow questions, Wikipedia edits) to estimate deployment effects with interrupted time series
              and synthetic controls.
            data: Stack Exchange dumps, Community Notes data, Wikipedia pageviews
            rl:
              pattern: ope
              title: Off-policy deployment evaluation
              what: >-
                Where logs record actions and outcomes, use off-policy evaluation (inverse propensity or doubly
                robust) to estimate what a different deployment policy would have achieved.
          - title: Wikipedia AI footprint
            effort: M
            what: >-
              Use Wikipedia dumps to follow content tagged by WikiProject AI Cleanup: revert rate, citation quality
              and how long it survives compared with similar human edits.
            data: Wikipedia dumps, WikiProject AI Cleanup lists
            rl:
              pattern: bandit
              title: Active labelling
              what: >-
                A bandit chooses which edits to label by hand, estimating the effect with the fewest labels.

top_picks:
  - idea: P1.4b
    why: >-
      Answers Track 1's "find gameable exploits" challenge directly and is not a listed example. The hand-written
      cheat policies give a result by Saturday night, and the GRPO version fits a 0.5B model on the RTX 3080.
    kill: >-
      Drop if no cheat policy moves any public benchmark. Write that up as a short robustness result and switch
      to P1.2b.
  - idea: P1.2b
    why: >-
      A clean, cheap 2x2 that separates good updating from caving, which the sprint asks for in so many words. The
      RL version shows whether that line can be trained into a model.
    kill: >-
      Drop if SycEval or later work already crosses evidence validity with initial correctness. Fall back to the
      commitment ledger (P1.2a).
  - idea: P2.1a
    why: >-
      The ledger is a listed example, but the RL-cheater version turns it into a mechanism-design result: which
      scoring rule survives a source that learns to game it.
    kill: >-
      Drop real data if we can't collect around 500 dated, attributed, resolved claims by Saturday evening. Run on
      fully simulated sources instead.
  - idea: P3.2b
    why: >-
      Gives one headline number (how far the model sides with whoever is talking), runs cheaply across many models,
      and ties directly to Jonathan Stray's Saturday talk.
    kill: >-
      Drop if ELEPHANT or similar work already reports both-sides flips. Extend it to drafted messages instead (P3.2a).
  - idea: P2.2a
    why: >-
      Builds on our log-tampering diagnosis work from the Swarm Alignment sprint, so we can go deep fast. It must be
      declared as prior work.
    kill: >-
      Drop if it would read as a rerun of our own earlier submission. Reframe it around omission detection (P2.2d).
